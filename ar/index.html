<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realidad Aumentada — Matías Montesinos</title>
  <style>
    body {
      margin: 0 auto; padding: 24px;
      font-family: -apple-system, system-ui, sans-serif;
      background: #0d0d12; color: #eee;
      max-width: 520px;
    }
    h1 { font-size: 22px; margin-bottom: 4px; }
    p.sub { color: #999; font-size: 14px; margin-top: 0; }
    a.card {
      display: block; margin: 18px 0; padding: 16px;
      background: #1a1a24; border: 1px solid #2c2c3a;
      border-radius: 12px; text-decoration: none; color: #eee;
    }
    a.card img { width: 100%; border-radius: 8px; display: block; }
    a.card strong { display: block; margin-top: 12px; font-size: 17px; }
    a.card span { color: #999; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Augmented Reality</h1>
  <p class="sub">Point your phone camera at the printed poster.</p>

  <a class="card" href="./disco-fargo3d/">
    <img src="./disco-fargo3d/target.png" alt="Disco protoplanetario">
    <strong>Disco protoplanetario</strong>
    <span>Simulacion hidrodinamica FARGO3D</span>
  </a>
</body>
</html>
