<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FARGO3D AR - v2</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}</style>
</head>
<body>
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: true; uiLoading: no; filterMinCF: 0.001; filterBeta: 0.01;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video id="ar-video" src="./video.mp4" preload="auto" loop muted
             playsinline webkit-playsinline crossorigin="anonymous"></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target0" mindar-image-target="targetIndex: 0">

      <a-plane position="0 0 0" width="1.0" height="0.75"
               material="shader: flat; src: #ar-video"></a-plane>

      <a-entity position="-0.020 -0.004 0.06" rotation="37 0 0">

        <a-ring radius-inner="0.0955" radius-outer="0.0979"
                material="shader: flat; color: #ffd24a; side: double; opacity: 0.9; transparent: true"></a-ring>

        <a-sphere position="0 0.0967 0" radius="0.011"
                  material="shader: flat; color: #ffffff"></a-sphere>

        <a-sphere position="0 0 0" radius="0.013"
                  material="shader: flat; color: #ffcc33"></a-sphere>

      </a-entity>

    </a-entity>
  </a-scene>

  <script>
    const video = document.getElementById('ar-video');
    const target = document.getElementById('target0');
    target.addEventListener('targetFound', () => video.play().catch(e => console.warn(e)));
    target.addEventListener('targetLost', () => video.pause());
    document.body.addEventListener('click', () => {
      if (video.paused) video.play().then(() => video.pause()).catch(e => console.warn(e));
    }, { once: true });
  </script>
</body>
</html>
