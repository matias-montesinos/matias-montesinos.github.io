cat > index.html << 'EOF'
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FARGO3D AR - v2</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}</style>
</head>
<body>
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: true; uiLoading: no; filterMinCF: 0.001; filterBeta: 0.01;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video id="ar-video" src="./video.mp4" preload="auto" loop muted
             playsinline webkit-playsinline crossorigin="anonymous"></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target0" mindar-image-target="targetIndex: 0">

      <!-- z=0 : el video, pegado al papel -->
      <a-plane position="0 0 0" width="1.0" height="0.75"
               material="shader: flat; src: #ar-video"></a-plane>

      <!-- z=0.08 : anillo flotante -->
      <a-ring position="0 0.02 0.08" radius-inner="0.20" radius-outer="0.215"
              material="shader: flat; color: #ff5533; side: double"></a-ring>

      <!-- z=0.08 : marcador esferico sobre el anillo -->
      <a-sphere position="0.207 0.02 0.08" radius="0.018"
                material="shader: flat; color: #ff5533"></a-sphere>

      <!-- z=0.20 : marcador mas alto, para contraste de profundidad -->
      <a-sphere position="-0.15 -0.12 0.20" radius="0.014"
                material="shader: flat; color: #33ddff"></a-sphere>

    </a-entity>
  </a-scene>

  <script>
    const video = document.getElementById('ar-video');
    const target = document.getElementById('target0');
    target.addEventListener('targetFound', () => video.play().catch(e => console.warn(e)));
    target.addEventListener('targetLost', () => video.pause());
    document.body.addEventListener('click', () => {
      if (video.paused) video.play().then(() => video.pause()).catch(e => console.warn(e));
    }, { once: true });
  </script>
</body>
</html>
EOF

head -3 index.html
