<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FARGO3D WebAR Prototype</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: Arial, sans-serif; }
    #overlay {
      position: fixed; z-index: 10; left: 0; right: 0; top: 0;
      padding: 10px 14px; background: rgba(0,0,0,0.55); color: #fff;
      font-size: 14px; line-height: 1.35;
    }
    #status {
      position: fixed; z-index: 11; left: 12px; bottom: 12px;
      padding: 8px 10px; background: rgba(0,0,0,0.6); color: #fff;
      border-radius: 8px; font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="overlay">
    <strong>FARGO3D AR prototype</strong><br>
    1. Allow camera access.<br>
    2. Point the phone to the printed target image.<br>
    3. The animation should appear registered on top of the figure.
  </div>
  <div id="status">Status: initializing...</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: true; uiLoading: yes; filterMinCF: 0.001; filterBeta: 0.01;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >
    <a-assets>
      <video
        id="ar-video"
        src="./video.mp4"
        preload="auto"
        loop
        muted
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
      ></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target0" mindar-image-target="targetIndex: 0">
      <!-- Plane size chosen to preserve 800x600 = 4:3 aspect ratio -->
      <a-plane
        id="video-plane"
        position="0 0 0"
        width="1.0"
        height="0.75"
        material="shader: flat; src: #ar-video; transparent: true"
      ></a-plane>
    </a-entity>
  </a-scene>

  <script>
    const statusEl = document.getElementById('status');
    const video = document.getElementById('ar-video');
    const target = document.getElementById('target0');
    const scene = document.querySelector('a-scene');

    const setStatus = (msg) => statusEl.textContent = `Status: ${msg}`;

    scene.addEventListener('loaded', () => {
      setStatus('scene loaded; waiting for target');
      video.pause();
      video.currentTime = 0;
    });

    target.addEventListener('targetFound', async () => {
      try {
        video.currentTime = 0;
        await video.play();
        setStatus('target found; video playing');
      } catch (err) {
        console.error(err);
        setStatus('target found; tap screen if autoplay is blocked');
      }
    });

    target.addEventListener('targetLost', () => {
      video.pause();
      setStatus('target lost; video paused');
    });

    // Fallback: many mobile browsers require a user gesture before video playback.
    document.body.addEventListener('click', async () => {
      if (video.paused) {
        try {
          await video.play();
          video.pause();
          setStatus('user gesture received; ready');
        } catch (err) {
          console.error(err);
        }
      }
    }, { once: true });
  </script>
</body>
</html>
